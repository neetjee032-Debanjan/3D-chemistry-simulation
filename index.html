<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>3D Chemistry Lab - Atomic Structure & Chemical Bonding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1e;
            color: #eef2ff;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background: rgba(15, 23, 42, 0.95);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid #2d3a5e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            z-index: 10;
        }
        .logo h1 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 0.7rem;
            color: #94a3b8;
        }
        .topic-nav {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .topic-btn {
            background: #1e293b;
            border: none;
            color: #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }
        .topic-btn.active, .topic-btn:hover {
            background: #3b82f6;
            color: white;
        }
        .main-panel {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .info-sidebar {
            width: 380px;
            background: rgba(10, 15, 30, 0.95);
            border-right: 1px solid #1e2a44;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .canvas-container {
            flex: 1;
            position: relative;
            background: #030617;
        }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #2d3a5e;
        }
        .card h3 {
            margin-bottom: 0.75rem;
            color: #60a5fa;
            font-size: 1rem;
        }
        .card h4 {
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 0.8rem;
            background: #1e293b;
            border: 1px solid #3b4a6b;
            color: white;
            margin: 0.5rem 0;
            cursor: pointer;
        }
        .info-text {
            font-size: 0.8rem;
            line-height: 1.4;
            color: #cbd5f0;
        }
        .property-row {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            border-bottom: 1px solid #2d3a5e;
            font-size: 0.8rem;
        }
        button {
            background: #3b82f6;
            border: none;
            padding: 0.5rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            margin: 0.5rem 0;
            cursor: pointer;
            width: 100%;
            font-size: 0.8rem;
        }
        button:hover {
            background: #2563eb;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        .orbital-btn {
            background: #1e293b;
            border: 1px solid #3b4a6b;
            padding: 0.4rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .orbital-btn:hover {
            background: #3b82f6;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-atom"></i> Quantum Visuals</h1>
                <p>Atomic Structure | Bonding | 3D Lab</p>
            </div>
            <div class="topic-nav">
                <button class="topic-btn active" data-topic="atomic">⚛️ Atomic Structure</button>
                <button class="topic-btn" data-topic="orbitals">🌀 Orbital Explorer</button>
                <button class="topic-btn" data-topic="vsepr">📐 VSEPR Theory</button>
                <button class="topic-btn" data-topic="hybridization">🔬 Hybridization</button>
                <button class="topic-btn" data-topic="resources">📚 Resources</button>
            </div>
        </div>
        <div class="main-panel">
            <div class="info-sidebar" id="infoSidebar"></div>
            <div class="canvas-container">
                <canvas id="canvas3d"></canvas>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
