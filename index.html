<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AtomLab</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body { margin:0; font-family:Arial; background:#0b0f1a; color:white; }
#container { display:flex; }

.sidebar {
  width:200px;
  padding:10px;
  background:#111827;
}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

canvas {
  background:transparent;
}
button, select {
  width:100%;
  margin:5px 0;
}
.page { display:none; }
.page.active { display:block; }
</style>

</head>

<body>

<div id="container">

  <div class="sidebar">
    <button onclick="showPage('atomic')">Atomic</button>
    <button onclick="showPage('orbital')">Orbital</button>
    <button onclick="showPage('bonding')">Bonding</button>

    <hr/>

    <select id="element-select"></select>

    <div>
      <p>Element: <span id="el-symbol"></span></p>
      <p>Z: <span id="el-z"></span></p>
      <p>Protons: <span id="el-protons"></span></p>
      <p>Electrons: <span id="el-electrons"></span></p>
    </div>
  </div>

  <div class="main">

    <div id="page-atomic" class="page active">
      <canvas id="atom-canvas"></canvas>
    </div>

    <div id="page-orbital" class="page">
      <h2>Orbital Page</h2>
    </div>

    <div id="page-bonding" class="page">
      <h2>Bonding Page</h2>
    </div>

  </div>

</div>

<script>
/////////////////////////////////////////////////////
// ATOMLAB CLEAN WORKING ENGINE (NO BUG VERSION)
/////////////////////////////////////////////////////

const SYMBOLS = [
"H","He","Li","Be","B","C","N","O","F","Ne",
"Na","Mg","Al","Si","P","S","Cl","Ar",
"K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn",
"Ga","Ge","As","Se","Br","Kr",
"Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd",
"In","Sn","Sb","Te","I","Xe",
"Cs","Ba","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Lu",
"Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg",
"Tl","Pb","Bi","Po","At","Rn",
"Fr","Ra","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No","Lr",
"Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og"
];

// ---------------------
// STATE
// ---------------------
let Z = 1;

// ---------------------
// UI INIT
// ---------------------
function initDropdown() {
  const sel = document.getElementById("element-select");

  SYMBOLS.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = i + 1;
    opt.innerText = `${s} (${i+1})`;
    sel.appendChild(opt);
  });

  sel.value = 1;
}

// ---------------------
// UI UPDATE
// ---------------------
function updateUI() {
  const symbol = SYMBOLS[Z - 1];

  document.getElementById("el-symbol").innerText = symbol;
  document.getElementById("el-z").innerText = Z;
  document.getElementById("el-protons").innerText = Z;
  document.getElementById("el-electrons").innerText = Z;
}

// ---------------------
// PAGE SWITCH
// ---------------------
function showPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + id).classList.add("active");
}

// ---------------------
// THREE JS ATOM ENGINE
// ---------------------
class Atom {
  constructor() {
    const canvas = document.getElementById("atom-canvas");

    this.scene = new THREE.Scene();

    this.camera = new THREE.PerspectiveCamera(60,1,0.1,1000);
    this.camera.position.z = 18;

    this.renderer = new THREE.WebGLRenderer({
      canvas,
      alpha:true,
      antialias:true
    });

    this.renderer.setSize(500,500);

    // nucleus
    const nucleus = new THREE.Mesh(
      new THREE.SphereGeometry(1,32,32),
      new THREE.MeshBasicMaterial({color:0xff4444})
    );

    this.scene.add(nucleus);

    this.electrons = [];

    this.animate();
  }

  build(Z) {

    this.electrons.forEach(e => this.scene.remove(e));
    this.electrons = [];

    const shells = [2,8,18,32,50,72,98];

    let remaining = Z;
    let base = 2;

    for(let s=0;s<shells.length;s++) {

      if(remaining<=0) break;

      const count = Math.min(shells[s], remaining);
      const radius = base + s*2;

      for(let i=0;i<count;i++) {

        const e = new THREE.Mesh(
          new THREE.SphereGeometry(0.15,16,16),
          new THREE.MeshBasicMaterial({color:0x00d4ff})
        );

        e.userData = {
          angle: (i/count)*Math.PI*2,
          radius: radius,
          speed: 0.02 + s*0.002
        };

        this.scene.add(e);
        this.electrons.push(e);
      }

      remaining -= count;
    }
  }

  update(Z) {
    this.build(Z);
  }

  animate() {
    requestAnimationFrame(()=>this.animate());

    this.electrons.forEach(e=>{
      e.userData.angle += e.userData.speed;

      e.position.x = Math.cos(e.userData.angle)*e.userData.radius;
      e.position.y = Math.sin(e.userData.angle)*e.userData.radius;
    });

    this.renderer.render(this.scene,this.camera);
  }
}

// ---------------------
// INIT SYSTEM
// ---------------------
let atom;

window.addEventListener("DOMContentLoaded", ()=> {

  initDropdown();

  atom = new Atom();

  const sel = document.getElementById("element-select");

  sel.addEventListener("change", ()=> {
    Z = parseInt(sel.value);
    updateUI();
    atom.update(Z);
  });

  Z = 1;
  updateUI();
  atom.update(1);
});
</script>

</body>
</html>
