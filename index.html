<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atomic + Molecular Lab</title>
  <style>
    body { margin: 0; font-family: Arial; overflow: hidden; background:#060a18; color:white; }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 340px;
      background: rgba(0,0,0,0.7);
      padding: 12px;
      border-radius: 12px;
      z-index: 10;
    }

    select, input, button {
      width: 100%;
      margin-top: 8px;
      padding: 6px;
    }

    #info { margin-top: 10px; font-size: 13px; line-height: 1.5; }

    canvas { display:block; }
  </style>
</head>
<body>

<div id="ui">
  <h3>Atomic + Molecular Lab</h3>

  <select id="elementSelect"></select>
  <button onclick="loadAtom()">Load Atom</button>

  <hr>

  <input id="molInput" placeholder="Enter molecule: H2O, CO2, NH3, CH4">
  <button onclick="buildMolecule()">Build Molecule</button>

  <button onclick="resetScene()">Reset</button>

  <div id="info"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
