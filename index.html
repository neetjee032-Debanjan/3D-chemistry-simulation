<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atom Simulation 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root{
      --bg:#060a14;--panel:#111827;--border:#1e3050;--accent:#00d4ff;--accent2:#7c3aed;
      --accent3:#10b981;--gold:#f59e0b;--text:#e2e8f0;--text2:#94a3b8;--rad:12px;
      --font:Segoe UI,system-ui,sans-serif
    }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
    .app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
    .side{padding:16px;background:#09111f;border-right:1px solid var(--border);overflow:auto}
    .main{padding:16px}
    .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--rad);overflow:hidden;margin-bottom:16px}
    .card h3{margin:0;padding:14px 16px;border-bottom:1px solid var(--border);color:var(--accent);font-size:14px}
    .card .body{padding:16px}
    select,button{width:100%;background:#0d1424;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px}
    button{cursor:pointer;background:rgba(0,212,255,.1);color:var(--accent);margin-top:10px}
    button:hover{background:rgba(0,212,255,.18)}
    .canvas-wrap{height:calc(100vh - 32px);min-height:680px;background:radial-gradient(circle at center,#0d1a2e 0,#060a14 100%);border:1px solid var(--border);border-radius:var(--rad);position:relative;overflow:hidden}
    canvas{display:block;width:100%!important;height:100%!important}
    .overlay{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:rgba(6,10,20,.8);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--text2)}
    .hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;background:rgba(6,10,20,.7);border:1px solid var(--border);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--text2)}
    .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(30,48,80,.55);font-size:13px}
    .row:last-child{border-bottom:none}.label{color:var(--text2)} .value{font-weight:600}
    @media (max-width:900px){.app{grid-template-columns:1fr}.canvas-wrap{height:70vh;min-height:500px}.side{border-right:none;border-bottom:1px solid var(--border)}}
  </style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="card">
      <h3>Element</h3>
      <div class="body">
        <select id="element-select"></select>
        <button id="toggle-spin">Toggle Animation</button>
        <button id="toggle-nucleus">Toggle Nucleus</button>
        <button id="reset-view">Reset View</button>
      </div>
    </div>
    <div class="card">
      <h3>Properties</h3>
      <div class="body" id="info"></div>
    </div>
    <div class="card">
      <h3>Shells</h3>
      <div class="body" id="shells"></div>
    </div>
  </div>
  <div class="main">
    <div class="canvas-wrap">
      <div class="overlay">
        <div class="chip" id="chip-name">Hydrogen</div>
        <div class="chip" id="chip-config">1s1</div>
      </div>
      <canvas id="atom-canvas"></canvas>
      <div class="hint">Drag to rotate • Scroll to zoom</div>
    </div>
  </div>
</div>

<script src="atom.js"></script>
</body>
</html>
