<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Chemistry Lab: Atomic Structure & Chemical Bonding</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f1e;
            color: #eef2ff;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-bottom: 1px solid #2d3a5e;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .topic-nav {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .topic-btn {
            background: #1e293b;
            border: none;
            color: #cbd5e1;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .topic-btn.active,
        .topic-btn:hover {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .main-panel {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .info-sidebar {
            width: 320px;
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(8px);
            border-right: 1px solid #1e2a44;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 1.2rem;
            gap: 1.2rem;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #030617;
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .card {
            background: #0f172ad9;
            border-radius: 1.2rem;
            padding: 1rem;
            border: 1px solid #2d3a5e;
        }

        .element-selector,
        .molecule-selector {
            width: 100%;
        }

        select,
        input {
            width: 100%;
            padding: 0.6rem;
            border-radius: 0.8rem;
            background: #1e293b;
            border: 1px solid #3b4a6b;
            color: white;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .info-text {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #cbd5f0;
        }

        .prop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-top: 0.8rem;
        }

        .prop-item {
            background: #1e293b70;
            padding: 0.4rem;
            border-radius: 12px;
            text-align: center;
        }

        .resource-list {
            list-style: none;
            margin-top: 0.5rem;
        }

        .resource-list li {
            margin: 0.5rem 0;
        }

        .resource-list a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.8rem;
        }

        button.simulate {
            background: #3b82f6;
            border: none;
            padding: 0.5rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            margin-top: 0.5rem;
            cursor: pointer;
            width: 100%;
        }

        .badge {
            font-size: 0.7rem;
            background: #2563eb;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
        }

        .mt-2 {
            margin-top: 0.5rem;
        }

        @media (max-width: 780px) {
            .info-sidebar {
                width: 270px;
            }

            .topic-btn {
                padding: 0.3rem 0.8rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">
                <h1><i class="fas fa-atom"></i> Quantum Visuals</h1>
                <p>Atomic Structure | Bonding | 3D Lab</p>
            </div>
            <div class="topic-nav">
                <button class="topic-btn active" data-topic="atomic">⚛️ Atomic Structure</button>
                <button class="topic-btn" data-topic="orbitals">🌀 Orbital Explorer</button>
                <button class="topic-btn" data-topic="vsepr">📐 VSEPR & Hybridization</button>
                <button class="topic-btn" data-topic="mot">⚡ Molecular Orbital (MO)</button>
                <button class="topic-btn" data-topic="resources">📚 Resources</button>
            </div>
        </div>
        <div class="main-panel">
            <div class="info-sidebar" id="infoSidebar">
                <!-- Dynamic content loaded via JS -->
            </div>
            <div class="canvas-container">
                <canvas id="canvas3d"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
