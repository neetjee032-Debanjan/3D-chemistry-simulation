<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atomic Structure Lab</title>
  <style>
    body { margin: 0; font-family: Arial; background: #070b18; color: white; overflow: hidden; }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 320px;
      background: rgba(0,0,0,0.65);
      padding: 12px;
      border-radius: 12px;
      z-index: 10;
    }

    select, button {
      width: 100%;
      margin-top: 8px;
      padding: 6px;
    }

    #info {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    canvas { display: block; }
  </style>
</head>
<body>

<div id="ui">
  <h3>Atomic Structure Lab</h3>

  <select id="elementSelect"></select>
  <button onclick="loadAtom()">Load Atom</button>

  <div id="info"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="script.js"></script>

</body>
</html>
